[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-library"
version = "0.1.0"
description = "AI Knowledge Library Agent System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    "Jinja2>=3.1.6",
    "PyYAML>=6.0.3",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "beautifulsoup4>=4.15.0",
    "requests>=2.33.1",
    "streamlit>=1.59.0",
    "boto3>=1.43.52",
    "textual>=8.2.8",
    "litellm>=1.83.7",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.8",
    "langchain-core>=1.5.3",
    "langsmith>=0.10.0",
    "mcp>=1.28.1,<2.0.0"
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "google-genai>=2.10.0"
]
postgres = [
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.5.0"
]
queue = [
    "celery>=5.6.3",
    "redis>=8.0.1"
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "flake8",
    "black",
    "bandit",
    "pdoc",
    "jsonschema"
]

[project.scripts]
ai = "src.control_plane.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
