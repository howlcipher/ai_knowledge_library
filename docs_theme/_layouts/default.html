<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: "HowlPlane | An AI Engineering Control Plane" }}</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="alternate icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="container">
        <header>
            <div>
                <p class="kicker">// AI Engineering Control Plane / Documentation</p>
                <h1 id="main-title">HowlPlane</h1>
            </div>
            <div class="header-actions">
                <a href="{{ '/' | relative_url }}">[ Home ]</a>
                <a href="{{ '/api/' | relative_url }}">[ API ]</a>
                <a href="https://github.com/howlcipher/howlplane" target="_blank" rel="noreferrer">[ View on GitHub ]</a>
                <button id="theme-toggle" type="button" aria-pressed="false">Switch to light theme</button>
            </div>
        </header>

        <main id="main-content">
            <section id="doc-content">
                {{ content }}
            </section>
        </main>

        <footer>
            <div>
                <span class="status-dot"></span>
                <span>SYS_STATUS: ACTIVE // HOWLPLANE CONTROL PLANE</span>
            </div>
            <div>
                <a href="{{ '/' | relative_url }}">Home</a> |
                <a href="{{ '/api/' | relative_url }}">API</a> |
                <a href="https://github.com/howlcipher/howlplane" target="_blank" rel="noreferrer">GitHub</a> |
                <a href="https://howlcipher.github.io/howlframe/" target="_blank" rel="noreferrer">HowlFrame</a>
            </div>
        </footer>
    </div>
    <script src="{{ '/app.js' | relative_url }}"></script>
</body>
</html>
